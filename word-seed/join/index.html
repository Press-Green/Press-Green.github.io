<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join a room · WORD SEED</title>
  <meta name="description" content="Join a WORD SEED multiplayer room.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1C2E1A">
  <link rel="icon" href="../../assets/word-seed-icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1C2E1A; --surface: #2F4A2B; --text: #FBF4E6; --muted: #CFC2A8;
      --primary: #8FD46A; --on-primary: #1C2E1A; --gold: #F7C548;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 500 18px/1.5 Fredoka, system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    }
    main { width: 100%; max-width: 420px; text-align: center; display: grid; gap: 20px; }
    img { width: 88px; height: 88px; border-radius: 22px; margin: 0 auto; }
    h1 { margin: 0; font-size: 26px; font-weight: 700; }
    .code { font-size: 64px; font-weight: 700; letter-spacing: 0.14em; color: var(--gold); line-height: 1.1; }
    p { margin: 0; color: var(--muted); }
    .button {
      display: block; padding: 14px 20px; border-radius: 999px; text-decoration: none; font-weight: 700;
      background: var(--primary); color: var(--on-primary); font-size: 20px;
    }
    .button.secondary { background: var(--surface); color: var(--text); font-weight: 600; font-size: 17px; }
    .button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="../../assets/word-seed-icon.png" alt="" width="88" height="88">
    <h1 id="title"></h1>
    <div class="code" id="code" aria-live="polite"></div>
    <a class="button" id="open" href="#"></a>
    <a class="button secondary" id="store" href="https://play.google.com/store/apps/details?id=com.pressgreen.wordseed"></a>
    <p id="how"></p>
  </main>
  <script>
  'use strict';
  // The TV's QR code lands here (see word-seed-game/src/app/+native-intent.tsx). On Android, once
  // this site's assetlinks.json lists the app, the link opens the app before this page loads.
  const PACKAGE = 'com.pressgreen.wordseed';
  const STORE = `https://play.google.com/store/apps/details?id=${PACKAGE}`;
  const pt = (navigator.language || '').toLowerCase().startsWith('pt');
  const t = pt
    ? { title: 'Entrar na sala', open: 'Abrir no WORD SEED', store: 'Baixar no Google Play',
        how: (c) => `Ou abra o app, toque em Multijogador e entre com o código ${c}.`, none: 'Abra o app e toque em Multijogador.' }
    : { title: 'Join the room', open: 'Open in WORD SEED', store: 'Get it on Google Play',
        how: (c) => `Or open the app, tap Multiplayer and join with code ${c}.`, none: 'Open the app and tap Multiplayer.' };
  document.documentElement.lang = pt ? 'pt-BR' : 'en';

  const raw = new URLSearchParams(location.search).get('code') || '';
  const code = /^[A-Za-z]{4}$/.test(raw) ? raw.toUpperCase() : '';
  const android = /android/i.test(navigator.userAgent);
  const appLink = `wordseed://join?code=${code}`;
  // Chrome on Android opens the app from an intent link, or the store when it isn't installed.
  const intentLink = `intent://join?code=${code}#Intent;scheme=wordseed;package=${PACKAGE};` +
    `S.browser_fallback_url=${encodeURIComponent(STORE)};end`;

  document.getElementById('title').textContent = t.title;
  document.getElementById('code').textContent = code;
  document.getElementById('store').textContent = t.store;
  document.getElementById('how').textContent = code ? t.how(code) : t.none;
  const open = document.getElementById('open');
  open.textContent = t.open;
  open.href = android ? intentLink : appLink;
  if (!code) open.hidden = true;
  // Straight to the app when the browser lets a page do that without a tap.
  if (code && android) location.href = intentLink;
  </script>
</body>
</html>
