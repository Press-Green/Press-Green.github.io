<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WORD SEED TV</title>
  <meta name="description" content="Show a WORD SEED multiplayer room on a TV: the board, the clock, the scores and every word found.">
  <meta name="theme-color" content="#1C2E1A">
  <link rel="icon" href="../../assets/word-seed-icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
  <style>
    /* WORD SEED's dark theme (word-seed-game/src/constants/theme.ts): a TV is watched in the dark. */
    :root {
      --bg: #1C2E1A;
      --surface: #2F4A2B;
      --surface-2: #3D5A38;
      --text: #FBF4E6;
      --muted: #CFC2A8;
      --primary: #8FD46A;
      --on-primary: #1C2E1A;
      --gold: #F7C548;
      --error: #E8957A;
      --tile: #F4CF9C;
      --tile-edge: #C08A50;
      --tile-text: #4A3324;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Fredoka, system-ui, sans-serif;
      font-weight: 500;
      overflow: hidden;
      cursor: default;
    }
    [hidden] { display: none !important; }
    button, input { font: inherit; }

    .view { position: fixed; inset: 0; display: flex; }
    .brand { font-weight: 700; letter-spacing: 0.04em; }
    .brand b { color: var(--primary); }
    .muted { color: var(--muted); }

    /* Entry: type the room code. */
    #entry { flex-direction: column; align-items: center; justify-content: center; gap: 3vh; padding: 16px; text-align: center; }
    #entry h1 { font-size: clamp(32px, 6vw, 96px); margin: 0; }
    #entry p { font-size: clamp(16px, 2vw, 32px); margin: 0; max-width: 36ch; }
    #entry form { display: flex; gap: 2vw; flex-wrap: wrap; justify-content: center; }
    #code-input {
      width: 5.2ch; padding: 0.15em 0.3em; border-radius: 0.3em;
      border: 0.06em solid var(--surface-2); background: var(--surface); color: var(--text);
      font-size: clamp(48px, 9vw, 160px); font-weight: 700; letter-spacing: 0.2em; text-align: center; text-transform: uppercase;
    }
    #code-input:focus { outline: 0.05em solid var(--primary); outline-offset: 0.04em; }
    .button {
      border: 0; border-radius: 999px; padding: 0.5em 1.4em; cursor: pointer;
      background: var(--primary); color: var(--on-primary); font-weight: 700; font-size: clamp(20px, 2.6vw, 44px);
    }
    .button:focus-visible { outline: 0.15em solid var(--text); outline-offset: 0.15em; }
    .button:disabled { opacity: 0.4; cursor: default; }
    #entry-error { color: var(--error); min-height: 1.6em; }
    #entry-go { background: var(--surface-2); color: var(--text); }

    /* A room: a bar on top, the stage below. */
    #room { flex-direction: column; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 2vw;
      padding: 1.6vh 3vw; font-size: clamp(16px, 2.2vw, 40px); flex: none;
    }
    .topbar .code { font-weight: 700; letter-spacing: 0.12em; }
    #status-line { font-size: 0.8em; }
    .stage { flex: 1; min-height: 0; display: flex; gap: 2vw; padding: 0 3vw 3vh; }

    /* Lobby. */
    .lobby { flex: 1; display: grid; grid-template-columns: 1.1fr 1fr; gap: 3vw; align-items: center; }
    .join-card { text-align: center; }
    .join-card .label { font-size: clamp(18px, 2.6vw, 48px); }
    .join-card .big-code { font-size: clamp(56px, 10vw, 200px); font-weight: 700; letter-spacing: 0.12em; line-height: 1.1; color: var(--gold); }
    .join-card .how { font-size: clamp(16px, 2vw, 36px); max-width: 26ch; margin: 1vh auto 0; }
    .qr { display: block; margin: 2vh auto 0; width: min(30vh, 22vw); height: auto; border-radius: 1.2vw; }
    .qr-small { display: flex; align-items: center; gap: 1.2vw; margin-top: 3vh; font-size: clamp(14px, 1.6vw, 30px); }
    .qr-small .qr { margin: 0; width: min(20vh, 12vw); flex: none; }
    .qr-small .code { color: var(--gold); font-weight: 700; letter-spacing: 0.12em; font-size: 1.6em; }
    .panel { background: var(--surface); border-radius: 2vw; padding: 2.5vw; }
    .panel h2 { margin: 0 0 1.5vh; font-size: clamp(20px, 2.6vw, 48px); font-weight: 600; }
    .players { list-style: none; margin: 0; padding: 0; display: grid; gap: 1vh; font-size: clamp(18px, 2.4vw, 44px); }
    .players li { display: flex; align-items: center; gap: 0.5em; }
    .players li.away { opacity: 0.45; }
    .dot { width: 0.6em; height: 0.6em; border-radius: 50%; flex: none; }
    .crown { color: var(--gold); width: 1.1em; flex: none; text-align: center; }
    .star { color: var(--gold); }
    .rules { margin-top: 2.5vh; display: flex; flex-wrap: wrap; gap: 1vw; font-size: clamp(14px, 1.8vw, 32px); }
    .chip { background: var(--surface-2); border-radius: 999px; padding: 0.25em 0.8em; }
    .waiting { margin-top: 2vh; font-size: clamp(14px, 1.8vw, 32px); }

    /* Match. */
    .match { flex: 1; display: grid; grid-template-columns: 1fr minmax(22vw, 28vw); gap: 3vw; min-height: 0; }
    .board { position: relative; min-height: 0; }
    .tile {
      position: absolute; display: flex; align-items: center; justify-content: center;
      clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
      background: var(--tile-edge);
      transition: left 420ms cubic-bezier(.2,.8,.2,1), top 420ms cubic-bezier(.2,.8,.2,1),
        width 420ms cubic-bezier(.2,.8,.2,1), height 420ms cubic-bezier(.2,.8,.2,1);
    }
    .tile::before {
      content: ''; position: absolute; inset: 5% 4% 9%;
      clip-path: inherit; background: var(--tile);
    }
    .tile span { position: relative; color: var(--tile-text); font-weight: 700; text-transform: uppercase; line-height: 1; margin-bottom: 4%; }
    .tile.new { animation: pop 520ms cubic-bezier(.3,1.6,.5,1) both; }
    @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    .side { display: flex; flex-direction: column; gap: 2.5vh; min-height: 0; }
    .clock { text-align: center; font-weight: 700; font-size: clamp(48px, 9vw, 180px); line-height: 1; font-variant-numeric: tabular-nums; }
    .clock.ending { color: var(--error); animation: beat 1s ease-in-out infinite; }
    @keyframes beat { 50% { transform: scale(1.06); } }
    .scores { list-style: none; margin: 0; padding: 0; display: grid; gap: 1.2vh; font-size: clamp(16px, 2.2vw, 40px); overflow: hidden; }
    .scores li {
      display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0.6em;
      background: var(--surface); border-radius: 0.6em; padding: 0.4em 0.7em;
      transition: transform 300ms;
    }
    .scores .nick { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .scores .pts { font-weight: 700; font-variant-numeric: tabular-nums; }
    .scores .count { grid-column: 2 / 4; font-size: 0.65em; margin-top: -0.3em; }
    .countdown {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: clamp(120px, 30vw, 520px); color: var(--gold);
    }
    .countdown span { animation: pop 500ms cubic-bezier(.3,1.6,.5,1) both; }

    /* Results. */
    .results { flex: 1; display: grid; grid-template-columns: minmax(24vw, 30vw) 1fr; gap: 3vw; min-height: 0; }
    .results h2 { margin: 0 0 1.5vh; font-size: clamp(20px, 2.8vw, 52px); font-weight: 700; }
    .winner { color: var(--gold); }
    .ranking { list-style: none; margin: 0; padding: 0; display: grid; gap: 1vh; font-size: clamp(16px, 2.1vw, 40px); }
    .ranking li { display: grid; grid-template-columns: 1.4em auto 1fr auto; align-items: center; gap: 0.5em; background: var(--surface); border-radius: 0.6em; padding: 0.4em 0.7em; }
    .ranking .place { font-weight: 700; color: var(--muted); text-align: center; }
    .ranking .nick { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ranking .pts { font-weight: 700; font-variant-numeric: tabular-nums; }
    .words-box { min-height: 0; display: flex; flex-direction: column; }
    .words-scroll { flex: 1; min-height: 0; overflow: hidden; position: relative; }
    .words { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--word-col, 24vw), 1fr)); gap: 0.6vh 1.5vw; font-size: var(--word-size, 2vw); }
    .words li { display: flex; align-items: center; gap: 0.5em; padding: 0.25em 0.6em; border-radius: 0.5em; background: var(--surface); min-width: 0; }
    .words li.shared { background: var(--surface-2); }
    .words .word { font-weight: 700; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .words .len { font-size: 0.7em; color: var(--muted); white-space: nowrap; }
    .words .who { margin-left: auto; display: flex; gap: 0.2em; flex: none; }
    .words .who .dot { width: 0.55em; height: 0.55em; }
    .legend { display: flex; flex-wrap: wrap; gap: 0.4em 1.2em; margin-top: 1.2vh; font-size: clamp(12px, 1.5vw, 28px); }
    .legend span { display: inline-flex; align-items: center; gap: 0.35em; }
    .empty { font-size: clamp(18px, 2.4vw, 44px); }

    .notice {
      position: fixed; left: 50%; bottom: 3vh; transform: translateX(-50%);
      background: var(--surface-2); padding: 0.5em 1.2em; border-radius: 999px; font-size: clamp(14px, 1.8vw, 32px);
    }
    #fullscreen {
      position: fixed; right: 1.5vw; bottom: 1.5vh; font-size: clamp(12px, 1.3vw, 22px); padding: 0.45em 1em;
      background: var(--surface); color: var(--muted); border-radius: 999px; border: 0; cursor: pointer;
      transition: opacity 400ms;
    }
    body.idle #fullscreen { opacity: 0; pointer-events: none; }
    body.idle { cursor: none; }

    @media (max-width: 720px) {
      .lobby, .match, .results { grid-template-columns: 1fr; overflow: auto; }
      body { overflow: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tile, .tile.new, .countdown span, .clock.ending { transition: none; animation: none; }
    }
  </style>
</head>
<body>
  <main id="entry" class="view">
    <h1 class="brand">WORD <b>SEED</b> TV</h1>
    <p id="entry-intro"></p>
    <button class="button" id="entry-create" type="button"></button>
    <p id="entry-or" class="muted"></p>
    <form id="entry-form" autocomplete="off">
      <input id="code-input" maxlength="4" inputmode="text" autocapitalize="characters" spellcheck="false" aria-label="Room code" placeholder="ABCD">
      <button class="button" id="entry-go" type="submit"></button>
    </form>
    <p id="entry-error" role="alert"></p>
  </main>

  <main id="room" class="view" hidden>
    <header class="topbar">
      <div class="brand">WORD <b>SEED</b></div>
      <div id="status-line" class="muted" aria-live="polite"></div>
      <div><span id="code-label" class="muted"></span> <span class="code" id="room-code"></span></div>
    </header>
    <section class="stage" id="stage"></section>
  </main>

  <div class="notice" id="notice" hidden aria-live="polite"></div>
  <button id="fullscreen" type="button"></button>

  <script>
  'use strict';

  // ---- Settings -------------------------------------------------------------------------------
  const params = new URLSearchParams(location.search);
  /** The API's socket origin. `?api=ws://localhost:3000` points a test at a local API. */
  const API = params.get('api') || 'wss://word-seed-api.pressgreen420.workers.dev';
  const HTTP_API = API.replace(/^ws/, 'http');
  /** Room codes: 4 consonants (word-seed-api/src/rooms/service.ts). */
  const CODE_LETTERS = 'BCDFGHJKLMNPQRSTVWXZ';
  const CODE_PATTERN = new RegExp('^[' + CODE_LETTERS + ']{4}$');
  const PLAYER_COLORS = ['#8FD46A', '#F7C548', '#7EC8F2', '#F29BC0', '#E8957A', '#C9A6F5', '#5ED6C2', '#F2E07E'];
  /** Height of a tile per unit of width (flat-top hexagon). */
  const CELL_RATIO = Math.sqrt(3) / 2;

  // ---- Words on screen ------------------------------------------------------------------------
  const STRINGS = {
    'pt-BR': {
      intro: 'Mostre uma sala de multijogador na TV: o tabuleiro, o tempo, os pontos e, no fim, todas as palavras.',
      go: 'Mostrar', codeLabel: 'Sala',
      create: 'Abrir uma sala nesta TV', or: 'ou mostre uma sala que já existe:',
      opening: 'Abrindo uma sala…', createFailed: 'Não deu para abrir uma sala. Confira a internet e tente de novo.',
      firstHosts: 'Quem entrar primeiro comanda a sala.',
      badCode: 'O código tem 4 letras, como no app.',
      notFound: 'Sala não encontrada. Confira o código no app.',
      closed: 'A sala foi fechada.', full: 'Esta sala já tem TVs demais.', outdated: 'O servidor ainda não aceita TVs. Tente mais tarde.',
      connecting: 'Conectando…', reconnecting: 'Reconectando…',
      joinHow: 'Aponte a câmera do celular para o QR code, ou abra Multijogador no app e digite o código.',
      joinLater: 'Para entrar na sala:', qrA11y: 'QR code para entrar na sala',
      players: (n) => `Jogadores (${n}/8)`, nobody: 'Ninguém na sala ainda.',
      waitingHost: (nick) => nick ? `Esperando ${nick} começar` : 'Esperando o anfitrião começar',
      minutes: (s) => s % 60 === 0 ? `${s / 60} min` : `${s} s`,
      hive: { small: 'Colmeia pequena', medium: 'Colmeia média', large: 'Colmeia grande' },
      grows: (s) => s === 0 ? 'Não cresce' : `Cresce a cada ${s % 60 === 0 ? s / 60 + ' min' : s + ' s'}`,
      playing: 'Valendo!', starting: 'Preparar…',
      words: (n) => n === 1 ? '1 palavra' : `${n} palavras`,
      results: 'Resultado', winner: (nick) => `${nick} venceu!`, tie: 'Empate!',
      wordsFound: 'Palavras encontradas', noWords: 'Ninguém encontrou palavras.',
      letters: (n) => `${n} letras`, nextMatch: 'O anfitrião começa a próxima partida pelo app.',
      fullscreen: 'Tela cheia', away: 'saiu', lastWinner: 'venceu a última partida',
    },
    en: {
      intro: 'Show a multiplayer room on the TV: the board, the clock, the scores and, at the end, every word.',
      go: 'Show', codeLabel: 'Room',
      create: 'Open a room on this TV', or: 'or show a room that already exists:',
      opening: 'Opening a room…', createFailed: 'Couldn’t open a room. Check the internet and try again.',
      firstHosts: 'The first player to join runs the room.',
      badCode: 'The code has 4 letters, as in the app.',
      notFound: 'Room not found. Check the code in the app.',
      closed: 'The room closed.', full: 'This room has too many TVs already.', outdated: 'The server doesn’t take TVs yet. Try again later.',
      connecting: 'Connecting…', reconnecting: 'Reconnecting…',
      joinHow: 'Point your phone’s camera at the QR code, or open Multiplayer in the app and type the code.',
      joinLater: 'To join the room:', qrA11y: 'QR code to join the room',
      players: (n) => `Players (${n}/8)`, nobody: 'Nobody in the room yet.',
      waitingHost: (nick) => nick ? `Waiting for ${nick} to start` : 'Waiting for the host to start',
      minutes: (s) => s % 60 === 0 ? `${s / 60} min` : `${s} s`,
      hive: { small: 'Small hive', medium: 'Medium hive', large: 'Large hive' },
      grows: (s) => s === 0 ? 'Never grows' : `Grows every ${s % 60 === 0 ? s / 60 + ' min' : s + ' s'}`,
      playing: 'Go!', starting: 'Get ready…',
      words: (n) => n === 1 ? '1 word' : `${n} words`,
      results: 'Results', winner: (nick) => `${nick} wins!`, tie: 'It’s a tie!',
      wordsFound: 'Words found', noWords: 'Nobody found a word.',
      letters: (n) => `${n} letters`, nextMatch: 'The host starts the next match from the app.',
      fullscreen: 'Full screen', away: 'left', lastWinner: 'won the last match',
    },
  };
  // Before a room says its language, the TV's own.
  let lang = (navigator.language || '').toLowerCase().startsWith('pt') ? 'pt-BR' : 'en';
  const t = () => STRINGS[lang];
  const localeOf = () => (lang === 'pt-BR' ? 'pt-BR' : 'en');

  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') node.className = v;
      else if (k === 'style') Object.assign(node.style, v);
      else node.setAttribute(k, v);
    }
    for (const child of children) if (child != null) node.append(child);
    return node;
  };

  // ---- Entry ----------------------------------------------------------------------------------
  function showEntry(error) {
    room.close();
    $('room').hidden = true;
    $('entry').hidden = false;
    $('entry-intro').textContent = t().intro;
    $('entry-go').textContent = t().go;
    $('entry-create').textContent = t().create;
    $('entry-or').textContent = t().or;
    $('entry-error').textContent = error || '';
    history.replaceState(null, '', location.pathname + (params.get('api') ? `?api=${encodeURIComponent(params.get('api'))}` : ''));
    $('entry-create').focus();
  }
  $('entry-create').addEventListener('click', () => createRoom());

  /**
   * Opens a room of the TV's own (no sign-in): its code and QR code show right away, and the
   * first player to join hosts it. Played in the TV's language until the host picks another.
   */
  async function createRoom() {
    $('entry').hidden = true;
    $('room').hidden = false;
    $('room-code').textContent = '';
    $('stage').replaceChildren();
    setStatus(t().opening);
    try {
      const response = await fetch(`${HTTP_API}/rooms/screen`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ language: lang }),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const { code } = await response.json();
      openRoom(code, true);
    } catch {
      showEntry(t().createFailed);
    }
  }
  $('code-input').addEventListener('input', (event) => {
    const input = event.target;
    input.value = [...input.value.toUpperCase()].filter((c) => CODE_LETTERS.includes(c)).join('').slice(0, 4);
    $('entry-error').textContent = '';
  });
  $('entry-form').addEventListener('submit', (event) => {
    event.preventDefault();
    const code = $('code-input').value;
    if (!CODE_PATTERN.test(code)) return void ($('entry-error').textContent = t().badCode);
    openRoom(code);
  });

  /** Shows a room; `own` when this TV opened it (it opens a new one if this one closes). */
  function openRoom(code, own = false) {
    const query = new URLSearchParams({ code });
    if (own) query.set('own', '1');
    if (params.get('api')) query.set('api', params.get('api'));
    history.replaceState(null, '', `${location.pathname}?${query}`);
    $('entry').hidden = true;
    $('room').hidden = false;
    $('room-code').textContent = code;
    $('code-label').textContent = t().codeLabel;
    room.open(code, own);
    keepAwake();
  }

  // ---- The room's socket ----------------------------------------------------------------------
  const room = {
    socket: null, code: '', tries: 0, timer: 0, ping: 0,
    state: null,
    /** The match on screen: its cells and its times on this clock. */
    match: null,
    own: false,
    open(code, own) {
      this.close();
      this.code = code;
      this.own = own;
      this.state = null;
      this.match = null;
      this.tries = 0;
      render();
      this.connect();
    },
    connect() {
      setStatus(this.tries ? t().reconnecting : t().connecting);
      const socket = new WebSocket(`${API}/rooms/${this.code}/socket`);
      this.socket = socket;
      socket.onopen = () => {
        socket.send(JSON.stringify({ type: 'watch' }));
        clearInterval(this.ping);
        this.ping = setInterval(() => socket.readyState === 1 && socket.send('{"type":"ping"}'), 20000);
      };
      socket.onmessage = (event) => {
        let message;
        try { message = JSON.parse(event.data); } catch { return; }
        this.receive(message);
      };
      socket.onclose = (event) => {
        if (this.socket !== socket) return;
        clearInterval(this.ping);
        this.socket = null;
        // This TV's own room closed (nobody played for a while): a fresh one takes its place.
        if ((event.code === 4004 || event.code === 1001) && this.own) return void createRoom();
        if (event.code === 4004) return showEntry(this.state ? t().closed : t().notFound);
        if (event.code === 1001) return showEntry(t().closed);
        if (event.code === 4009) return showEntry(t().full);
        // Dropped (Wi-Fi, a sleeping TV): back in a moment, sooner at first.
        this.tries++;
        setStatus(t().reconnecting);
        this.timer = setTimeout(() => this.connect(), Math.min(10000, 500 * 2 ** this.tries));
      };
    },
    close() {
      clearTimeout(this.timer);
      clearInterval(this.ping);
      const socket = this.socket;
      this.socket = null;
      if (socket) socket.close(1000);
    },
    receive(message) {
      switch (message.type) {
        case 'state': {
          this.tries = 0;
          const state = message.state;
          if (state.config && STRINGS[state.config.language === 'pt-BR' ? 'pt-BR' : 'en']) {
            lang = state.config.language === 'pt-BR' ? 'pt-BR' : 'en';
            document.documentElement.lang = lang;
          }
          // A new round's match comes before its state; an older match is gone.
          if (this.match && this.match.round !== state.round) this.match = null;
          if (state.status === 'lobby') this.match = null;
          this.state = state;
          setStatus('');
          render();
          break;
        }
        case 'match': {
          const now = performance.now();
          this.match = {
            round: message.round,
            cells: message.cells,
            fresh: new Set(),
            startsAt: now + message.startsInMs,
            endsAt: now + message.endsInMs,
          };
          render();
          break;
        }
        case 'grow': {
          if (!this.match || this.match.round !== message.round) return;
          this.match.cells = [...this.match.cells, ...message.cells];
          this.match.fresh = new Set(message.cells.map(cellKey));
          drawBoard();
          break;
        }
        case 'error':
          // An API from before TVs answers a screen's "watch" with unauthorized.
          if (message.code === 'unauthorized' || message.code === 'bad_request') showEntry(t().outdated);
          break;
      }
    },
  };

  function setStatus(text) {
    $('status-line').textContent = text;
  }

  // ---- Screens --------------------------------------------------------------------------------
  /** What's on screen, so a state that changes only the scores doesn't rebuild the board. */
  let shown = '';

  function render() {
    const { state, match } = room;
    $('fullscreen').textContent = t().fullscreen;
    $('code-label').textContent = t().codeLabel;
    const stage = $('stage');
    if (!state) {
      shown = 'none';
      stage.replaceChildren();
      return;
    }
    const inMatch = state.status !== 'lobby' && match && match.round === state.round;
    const view = inMatch ? `match:${match.round}` : state.results ? `results:${state.results.round}` : 'lobby';
    if (view !== shown) {
      shown = view;
      stage.replaceChildren();
      if (inMatch) buildMatch(stage);
      else if (state.results) buildResults(stage, state);
      else buildLobby(stage);
    }
    if (shown === 'lobby') fillLobby(state);
    if (shown.startsWith('match')) fillScores(state);
    if (shown.startsWith('results')) fillWaiting(state);
  }

  // Each player keeps one color, by their place in the room.
  const colors = new Map();
  function colorOf(id) {
    if (!colors.has(id)) colors.set(id, PLAYER_COLORS[colors.size % PLAYER_COLORS.length]);
    return colors.get(id);
  }
  function rememberColors(state) {
    for (const player of state.players) colorOf(player.id);
  }

  function buildLobby(stage) {
    stage.append(el('div', { class: 'lobby' },
      el('div', { class: 'join-card' },
        el('div', { class: 'label muted', id: 'lobby-label' }),
        el('div', { class: 'big-code', id: 'lobby-code' }),
        el('div', { id: 'lobby-qr' }),
        el('p', { class: 'how muted', id: 'lobby-how' })),
      el('div', { class: 'panel' },
        el('h2', { id: 'lobby-players-title' }),
        el('ul', { class: 'players', id: 'lobby-players' }),
        el('div', { class: 'rules', id: 'lobby-rules' }),
        el('div', { class: 'waiting muted', id: 'lobby-waiting' }))));
  }

  function fillLobby(state) {
    rememberColors(state);
    $('lobby-label').textContent = t().codeLabel;
    $('lobby-code').textContent = state.code;
    $('lobby-how').textContent = t().joinHow;
    showQr($('lobby-qr'), state.code);
    $('lobby-players-title').textContent = t().players(state.players.length);
    // The last match's winners (ties included) wear a star until the next match starts.
    const scores = state.results ? state.results.players.map((p) => p.score) : [];
    const best = Math.max(0, ...scores);
    const winners = new Set(best > 0 ? state.results.players.filter((p) => p.score === best).map((p) => p.id) : []);
    const list = $('lobby-players');
    list.replaceChildren(...(state.players.length
      ? state.players.map((p) => el('li', { class: p.connected ? '' : 'away' },
          el('span', { class: 'crown', 'aria-hidden': 'true' }, p.id === state.hostId ? '♛' : ''),
          el('span', { class: 'dot', style: { background: colorOf(p.id) } }),
          el('span', {}, p.nick),
          winners.has(p.id) ? el('span', { class: 'star', title: t().lastWinner, 'aria-label': t().lastWinner }, '★') : null))
      : [el('li', { class: 'muted' }, t().nobody)]));
    const { config } = state;
    $('lobby-rules').replaceChildren(
      el('span', { class: 'chip' }, t().minutes(config.duration)),
      el('span', { class: 'chip' }, t().hive[config.hive] || config.hive),
      el('span', { class: 'chip' }, t().grows(config.growEvery)));
    const host = state.players.find((p) => p.id === state.hostId);
    $('lobby-waiting').textContent = state.players.length ? t().waitingHost(host && host.nick) : t().firstHosts;
  }

  function buildMatch(stage) {
    stage.append(el('div', { class: 'match' },
      el('div', { class: 'board', id: 'board' }, el('div', { class: 'countdown', id: 'countdown', 'aria-live': 'assertive' })),
      el('div', { class: 'side' },
        el('div', { class: 'clock', id: 'clock', role: 'timer' }),
        el('ol', { class: 'scores', id: 'scores' }))));
    tiles.clear();
    drawBoard();
    tick();
  }

  function fillScores(state) {
    rememberColors(state);
    const players = [...state.players].sort((a, b) => b.score - a.score);
    $('scores').replaceChildren(...players.map((p) => el('li', { class: p.connected ? '' : 'away' },
      el('span', { class: 'dot', style: { background: colorOf(p.id) } }),
      el('span', { class: 'nick' }, p.nick),
      el('span', { class: 'pts' }, String(p.score)),
      el('span', { class: 'count muted' }, t().words(p.words)))));
  }

  // ---- The board ------------------------------------------------------------------------------
  const cellKey = (cell) => `${cell.column},${cell.y}`;
  /** Tiles on screen by cell, so a growth moves them instead of drawing them again. */
  const tiles = new Map();

  function drawBoard() {
    const board = $('board');
    const match = room.match;
    if (!board || !match) return;
    const cells = match.cells;
    const width = board.clientWidth;
    const height = board.clientHeight;
    if (!cells.length || !width || !height) return;
    // Bounds in tile widths.
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const cell of cells) {
      const x = cell.column * 0.75, y = cell.y * CELL_RATIO;
      minX = Math.min(minX, x); maxX = Math.max(maxX, x + 1);
      minY = Math.min(minY, y); maxY = Math.max(maxY, y + CELL_RATIO);
    }
    const size = Math.min(width / (maxX - minX), height / (maxY - minY), height / 3);
    const gap = size * 0.04;
    const left = (width - (maxX - minX) * size) / 2;
    const top = (height - (maxY - minY) * size) / 2;
    const seen = new Set();
    for (const cell of cells) {
      const key = cellKey(cell);
      seen.add(key);
      let tile = tiles.get(key);
      if (!tile) {
        tile = el('div', { class: 'tile' + (match.fresh.has(key) ? ' new' : '') }, el('span', {}, cell.letter));
        tiles.set(key, tile);
        board.append(tile);
      }
      Object.assign(tile.style, {
        left: `${left + (cell.column * 0.75 - minX) * size + gap / 2}px`,
        top: `${top + (cell.y * CELL_RATIO - minY) * size + gap / 2}px`,
        width: `${size - gap}px`,
        height: `${(size - gap) * CELL_RATIO}px`,
      });
      tile.firstChild.style.fontSize = `${size * 0.42}px`;
    }
    for (const [key, tile] of tiles) if (!seen.has(key)) { tile.remove(); tiles.delete(key); }
  }
  addEventListener('resize', () => drawBoard());

  // ---- Clock ----------------------------------------------------------------------------------
  function tick() {
    const match = room.match;
    const clock = $('clock');
    const countdown = $('countdown');
    if (!match || !clock) return;
    const now = performance.now();
    const toStart = match.startsAt - now;
    const left = Math.max(0, match.endsAt - now);
    if (toStart > 0) {
      const n = String(Math.ceil(toStart / 1000));
      if (countdown.textContent !== n) countdown.replaceChildren(el('span', {}, n));
      for (const tile of tiles.values()) tile.style.visibility = 'hidden';
      setStatus(t().starting);
    } else {
      if (countdown.textContent) countdown.replaceChildren();
      for (const tile of tiles.values()) tile.style.visibility = '';
      setStatus('');
    }
    const seconds = Math.ceil(Math.min(left, match.endsAt - Math.max(now, match.startsAt)) / 1000);
    const shownSeconds = Math.max(0, seconds);
    clock.textContent = `${Math.floor(shownSeconds / 60)}:${String(shownSeconds % 60).padStart(2, '0')}`;
    clock.classList.toggle('ending', toStart <= 0 && shownSeconds <= 10 && shownSeconds > 0);
  }
  setInterval(tick, 200);

  // ---- Results --------------------------------------------------------------------------------
  /**
   * Every word found, once: the words most players found first, then the longest, then A–Z. Each
   * shows who found it.
   */
  function wordList(results) {
    const words = new Map();
    for (const player of results.players) {
      for (const word of player.words) {
        const entry = words.get(word.key) || { key: word.key, display: word.display || word.key, points: word.points, players: [] };
        if (word.display && entry.display === entry.key) entry.display = word.display;
        entry.players.push(player.id);
        words.set(word.key, entry);
      }
    }
    const collator = new Intl.Collator(localeOf());
    return [...words.values()].sort((a, b) =>
      b.players.length - a.players.length || b.key.length - a.key.length || collator.compare(a.display, b.display));
  }

  function buildResults(stage, state) {
    rememberColors(state);
    const { results } = state;
    // Players who left keep their color from the match.
    for (const p of results.players) colorOf(p.id);
    const players = results.players;
    const best = players.length ? players[0].score : 0;
    const winners = players.filter((p) => p.score === best);
    const headline = best === 0 || winners.length !== 1 ? t().tie : t().winner(winners[0].nick);
    const place = (score) => players.findIndex((p) => p.score === score) + 1;

    const words = wordList(results);
    const list = el('ul', { class: 'words', id: 'words' });
    // Fewer words, bigger type: the list should fit the screen when it can.
    const size = words.length <= 12 ? 2.6 : words.length <= 30 ? 2.1 : words.length <= 60 ? 1.7 : 1.35;
    list.style.setProperty('--word-size', `${size}vw`);
    list.style.setProperty('--word-col', `${size * 11}vw`);
    for (const word of words) {
      list.append(el('li', { class: word.players.length > 1 ? 'shared' : '' },
        el('span', { class: 'word' }, word.display.toLocaleUpperCase(localeOf())),
        el('span', { class: 'len' }, t().letters(word.key.length)),
        el('span', { class: 'who', 'aria-label': word.players.map((id) => nickOf(results, id)).join(', ') },
          ...word.players.map((id) => el('span', { class: 'dot', style: { background: colorOf(id) } })))));
    }

    stage.append(el('div', { class: 'results' },
      el('div', {},
        el('h2', { class: 'winner' }, headline),
        el('ol', { class: 'ranking' }, ...players.map((p) => el('li', {},
          el('span', { class: 'place' }, String(place(p.score))),
          el('span', { class: 'dot', style: { background: colorOf(p.id) } }),
          el('span', { class: 'nick' }, p.nick, best > 0 && p.score === best ? el('span', { class: 'star', 'aria-label': t().lastWinner }, ' ★') : null),
          el('span', { class: 'pts' }, String(p.score))))),
        el('p', { class: 'waiting muted', id: 'results-waiting' }),
        el('div', { class: 'qr-small' }, el('div', { id: 'results-qr' }),
          el('div', {}, el('div', { class: 'muted' }, t().joinLater), el('div', { class: 'code' }, state.code)))),
      el('div', { class: 'words-box' },
        el('h2', {}, t().wordsFound),
        el('div', { class: 'words-scroll', id: 'words-scroll' },
          words.length ? list : el('p', { class: 'empty muted' }, t().noWords)),
        el('div', { class: 'legend' }, ...players.map((p) => el('span', {},
          el('span', { class: 'dot', style: { background: colorOf(p.id) } }), p.nick))))));
    showQr($('results-qr'), state.code);
    scrollWords();
  }

  function nickOf(results, id) {
    const player = results.players.find((p) => p.id === id);
    return player ? player.nick : '';
  }

  function fillWaiting(state) {
    const waiting = $('results-waiting');
    if (waiting) waiting.textContent = t().nextMatch;
  }

  // A list taller than the screen scrolls by itself, slowly, pausing at both ends: nobody holds a
  // remote to scroll it.
  let scrollRun = 0;
  function scrollWords() {
    const run = ++scrollRun;
    const box = $('words-scroll');
    if (!box) return;
    let direction = 1, pauseUntil = performance.now() + 4000, last = performance.now();
    const step = (now) => {
      if (run !== scrollRun || !box.isConnected) return;
      const room = box.scrollHeight - box.clientHeight;
      if (room > 2 && now > pauseUntil) {
        box.scrollTop += direction * Math.max(0.5, (now - last) * 0.03);
        if (box.scrollTop >= room - 1 || box.scrollTop <= 0) {
          direction = box.scrollTop <= 0 ? 1 : -1;
          pauseUntil = now + (direction === -1 ? 4000 : 4000);
          if (direction === -1) { box.scrollTop = room; }
        }
      }
      last = now;
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // ---- QR code ------------------------------------------------------------------------------
  /** The room's join link: the phone's camera opens the app in the room (word-seed/join/). */
  const joinLink = (code) => `${new URL('../join/', location.href).href}?code=${code}`;

  /** Draws the join link's QR code in `box`; nothing until the QR script loads (then again). */
  function showQr(box, code) {
    if (!box || box.dataset.code === code) return;
    if (!window.qrcode) {
      addEventListener('load', () => showQr(box, code), { once: true });
      return;
    }
    const qr = window.qrcode(0, 'M');
    qr.addData(joinLink(code));
    qr.make();
    const count = qr.getModuleCount();
    const quiet = 2;
    let path = '';
    for (let row = 0; row < count; row++) {
      for (let col = 0; col < count; col++) {
        if (qr.isDark(row, col)) path += `M${col + quiet} ${row + quiet}h1v1h-1z`;
      }
    }
    const size = count + quiet * 2;
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
    svg.setAttribute('class', 'qr');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', t().qrA11y);
    svg.setAttribute('shape-rendering', 'crispEdges');
    const back = document.createElementNS(ns, 'rect');
    back.setAttribute('width', size);
    back.setAttribute('height', size);
    back.setAttribute('fill', '#FBF4E6');
    const dots = document.createElementNS(ns, 'path');
    dots.setAttribute('d', path);
    dots.setAttribute('fill', '#1C2E1A');
    svg.append(back, dots);
    box.replaceChildren(svg);
    box.dataset.code = code;
  }

  // ---- TV comforts ----------------------------------------------------------------------------
  let wakeLock = null;
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch { /* Not allowed here: the TV may dim. */ }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && room.code) keepAwake();
  });

  $('fullscreen').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen?.();
    else document.documentElement.requestFullscreen?.().catch(() => {});
  });
  // The button and the pointer hide when nobody touches anything.
  let idleTimer = 0;
  const wake = () => {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 4000);
  };
  for (const type of ['mousemove', 'keydown', 'pointerdown']) addEventListener(type, wake);
  wake();

  // ---- Start ----------------------------------------------------------------------------------
  const startCode = (params.get('code') || '').toUpperCase();
  // A code in the address (a refresh, or a room picked by hand) is shown; otherwise the TV opens one.
  if (CODE_PATTERN.test(startCode)) openRoom(startCode, params.get('own') === '1');
  else createRoom();
  </script>
</body>
</html>
